<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha — Universidade de Fortaleza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
    --azul-unifor:#003366;
    --azul-destaque:#0056b3;
    --laranja:#d97706;
    --fundo:#f4f6f9;
    --branco:#ffffff;
    --texto:#17233a;
    --texto-suave:#5c6b82;
    --borda:#dbe3ee;
    --sombra:rgba(0,51,102,.14);
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{box-sizing:border-box;}

  html{
    touch-action:manipulation;
    scrollbar-gutter:stable;
    overflow-y:scroll;
  }

  html,body{
    margin:0;
    min-height:100vh;
    color:var(--texto);
    font-family:var(--font-body);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px 60px;
  }

  body{
    background-color:#001b3a;
    background-image:
      radial-gradient(circle at 18% 20%, rgba(0,86,179,.55), transparent 42%),
      radial-gradient(circle at 82% 15%, rgba(217,119,6,.42), transparent 46%),
      radial-gradient(circle at 50% 90%, rgba(0,86,179,.38), transparent 55%),
      linear-gradient(160deg, #00284f 0%, #012a52 45%, #001d3d 100%),
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size:200% 200%, 200% 200%, 200% 200%, 100% 100%, 28px 28px, 28px 28px;
    background-position:0% 0%, 100% 0%, 50% 100%, 0 0, center, center;
    animation:auroraShift 16s ease-in-out infinite;
  }

  @keyframes auroraShift{
    0%{background-position:0% 0%, 100% 0%, 50% 100%, 0 0, center, center;}
    50%{background-position:100% 60%, 20% 80%, 60% 10%, 0 0, center, center;}
    100%{background-position:0% 0%, 100% 0%, 50% 100%, 0 0, center, center;}
  }

  .page{
    width:100%;
    max-width:480px;
    background:rgba(255,255,255,.96);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border-radius:22px;
    padding:30px 26px 34px;
    box-shadow:0 24px 60px rgba(0,10,30,.5), 0 0 0 1px rgba(255,255,255,.08);
  }

  .letterhead{
    text-align:center;
    border-bottom:3px solid var(--azul-unifor);
    padding-bottom:16px;
    margin-bottom:22px;
    position:relative;
  }
  .letterhead::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-6px;
    height:2px;
    background:var(--laranja);
    width:64px;
    margin:0 auto;
  }
  .logo{
    width:52px;
    height:52px;
    display:block;
    margin:0 auto 10px;
  }
  .eyebrow{
    margin:0 0 6px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    color:var(--azul-destaque);
    font-weight:600;
    text-transform:uppercase;
  }
  h1{
    margin:0;
    font-family:var(--font-display);
    font-size:clamp(28px,7vw,36px);
    font-weight:700;
    letter-spacing:.02em;
    color:var(--azul-unifor);
    text-transform:uppercase;
  }

  .controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:20px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .field span{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.08em;
    color:var(--texto-suave);
    text-transform:uppercase;
  }
  select{
    appearance:none;
    -webkit-appearance:none;
    background:var(--branco) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23003366"/></svg>') no-repeat right 12px center;
    border:1.5px solid var(--borda);
    border-radius:8px;
    padding:10px 30px 10px 12px;
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:500;
    color:var(--texto);
    cursor:pointer;
    transition:border-color .15s ease;
  }
  select:hover, select:focus{
    border-color:var(--azul-destaque);
    outline:none;
  }
  select:focus-visible{
    box-shadow:0 0 0 3px rgba(0,86,179,.18);
  }

  .scoreboard{
    background:var(--branco);
    border:1.5px solid var(--borda);
    border-radius:12px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:16px 10px;
    box-shadow:0 6px 18px var(--sombra);
    margin-bottom:16px;
  }
  .score{
    text-align:center;
  }
  .score-label{
    display:block;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.08em;
    font-weight:600;
    margin-bottom:4px;
  }
  .score-x .score-label{color:var(--azul-unifor);}
  .score-o .score-label{color:var(--laranja);}
  .score-value{
    display:block;
    font-family:var(--font-display);
    font-size:30px;
    font-weight:700;
    line-height:1;
    transition:transform .2s ease;
  }
  .score-x .score-value{color:var(--azul-unifor);}
  .score-o .score-value{color:var(--laranja);}
  .score-value.bump{transform:scale(1.25);}

  .round-indicator{
    text-align:center;
    padding:0 14px;
    border-left:1px solid var(--borda);
    border-right:1px solid var(--borda);
  }
  .round-label{
    display:block;
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:.1em;
    color:var(--texto-suave);
    margin-bottom:4px;
  }
  .round-value{
    display:block;
    font-family:var(--font-mono);
    font-size:15px;
    font-weight:600;
    color:var(--texto);
  }

  .status{
    text-align:center;
    font-family:var(--font-body);
    font-size:14.5px;
    font-weight:600;
    line-height:1.3;
    color:var(--azul-destaque);
    min-height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 0 16px;
    letter-spacing:.01em;
    transition:color .15s ease;
  }
  .status.win{color:var(--laranja);}
  .status.draw{color:var(--texto-suave);}

  .board-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:22px;
  }
  .board{
    position:relative;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:8px;
    width:min(340px, 84vw);
    aspect-ratio:1/1;
    background:var(--azul-unifor);
    padding:8px;
    border-radius:14px;
    box-shadow:0 10px 26px var(--sombra);
  }
  .cell{
    width:100%;
    height:100%;
    min-width:0;
    min-height:0;
    background:var(--branco);
    border:none;
    border-radius:8px;
    font-family:var(--font-display);
    font-size:clamp(34px,8vw,46px);
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--texto);
    transition:background .12s ease, transform .08s ease;
    user-select:none;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    outline:none;
  }
  .cell:focus,
  .cell:focus-visible{
    outline:none;
    box-shadow:0 0 0 2px rgba(0,86,179,.35) inset;
  }
  @media (hover:hover) and (pointer:fine){
    .cell:enabled:hover{background:#eef3fa;}
  }
  .cell:disabled{cursor:default;}
  .cell[data-symbol="X"]{color:var(--azul-unifor);}
  .cell[data-symbol="O"]{color:var(--laranja);}
  .cell.pop{animation:pop .18s ease;}
  @keyframes pop{
    0%{opacity:0; transform:scale(.7);}
    100%{opacity:1; transform:scale(1);}
  }

  .win-line{
    position:absolute;
    height:6px;
    border-radius:3px;
    background:var(--laranja);
    box-shadow:0 0 12px rgba(217,119,6,.7);
    top:0; left:0;
    transform-origin:left center;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .win-line.show{opacity:1;}

  .btn-restart{
    display:block;
    margin:0 auto;
    background:var(--azul-unifor);
    color:var(--branco);
    border:none;
    padding:13px 30px;
    border-radius:9px;
    font-family:var(--font-mono);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .15s ease, transform .08s ease;
    touch-action:manipulation;
  }
  .btn-restart:hover{background:var(--azul-destaque);}
  .btn-restart:active{transform:scale(.97);}
  .btn-restart:focus-visible{
    outline:3px solid rgba(0,86,179,.35);
    outline-offset:2px;
  }

  #confettiCanvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
  }

  @media (prefers-reduced-motion: reduce){
    .cell.pop{animation:none;}
    .score-value.bump{transform:none;}
    body{animation:none;}
    *{transition:none !important;}
  }

  @media (max-width:380px){
    .controls{grid-template-columns:1fr;}
  }
</style>
</head>

    <p class="eyebrow">Universidade de Fortaleza</p>
    <h1>Jogo da Velha</h1>
  </header>

  <section class="controls">
    <label class="field">
      <span>Modo de Jogo</span>
      <select id="modeSelect">
        <option value="pvp" selected>2 Jogadores (PVP)</option>
        <option value="cpu">Contra o Computador</option>
      </select>
    </label>
    <label class="field">
      <span>Formato da Partida</span>
      <select id="formatSelect">
        <option value="single" selected>Partida Única</option>
        <option value="bo3">Melhor de 3 (MD3)</option>
      </select>
    </label>
  </section>

  <section class="scoreboard">
    <div class="score score-x">
      <span class="score-label" id="labelX">Jogador X</span>
      <span class="score-value" id="scoreX">0</span>
    </div>
    <div class="round-indicator">
      <span class="round-label">Rodada</span>
      <span class="round-value" id="roundValue">1/1</span>
    </div>
    <div class="score score-o">
      <span class="score-label" id="labelO">Jogador O</span>
      <span class="score-value" id="scoreO">0</span>
    </div>
  </section>

  <p class="status" id="status">Vez do Jogador X</p>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="win-line" id="winLine"></div>
    </div>
  </div>

  <button class="btn-restart" id="restartBtn">Reiniciar Jogo</button>
</div>

<canvas id="confettiCanvas"></canvas>

<script>
(function(){
  "use strict";


  let options = Array(9).fill('');
  let currentPlayer = 'X';
  let running = true;
  let winsX = 0;
  let winsO = 0;
  let currentRound = 1;
  let modeSelect = 'pvp';
  let formatSelect = 'single';

  const winPatterns = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];


  const boardEl = document.getElementById('board');
  const winLineEl = document.getElementById('winLine');
  const statusEl = document.getElementById('status');
  const scoreXEl = document.getElementById('scoreX');
  const scoreOEl = document.getElementById('scoreO');
  const labelOEl = document.getElementById('labelO');
  const roundValueEl = document.getElementById('roundValue');
  const modeSelectEl = document.getElementById('modeSelect');
  const formatSelectEl = document.getElementById('formatSelect');
  const restartBtn = document.getElementById('restartBtn');
  const confettiCanvas = document.getElementById('confettiCanvas');
  const ctx = confettiCanvas.getContext('2d');


  function buildBoard(){
    boardEl.querySelectorAll('.cell').forEach(c => c.remove());
    for(let i=0;i<9;i++){
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.dataset.index = i;
      btn.setAttribute('aria-label', 'Célula ' + (i+1));
      btn.addEventListener('click', () => handleCellClick(i));
      boardEl.appendChild(btn);
    }
  }
  buildBoard();

  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, duration, type, startTime, gainPeak){
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak || 0.18, startTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain).connect(ac.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  function playMoveSound(symbol){
    const ac = getAudioCtx();
    const t = ac.currentTime;
    if(symbol === 'X'){
      tone(523.25, 0.14, 'triangle', t, 0.16);
    } else {
      tone(392.00, 0.16, 'sine', t, 0.16);
    }
  }

  function playWinSound(){
    const ac = getAudioCtx();
    const t = ac.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
      tone(f, 0.35, 'triangle', t + idx*0.09, 0.14);
    });
  }

  function playDrawSound(){
    const ac = getAudioCtx();
    const t = ac.currentTime;
    [440, 349.23, 293.66].forEach((f, idx) => {
      tone(f, 0.28, 'sawtooth', t + idx*0.11, 0.10);
    });
  }

  function totalRounds(){
    return formatSelect === 'bo3' ? 3 : 1;
  }

  function updateRoundDisplay(){
    roundValueEl.textContent = currentRound + '/' + totalRounds();
  }

  function updateScoreboard(){
    scoreXEl.textContent = winsX;
    scoreOEl.textContent = winsO;
  }

  function bumpScore(el){
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  function setStatus(text, kind){
    statusEl.textContent = text;
    statusEl.classList.remove('win','draw');
    if(kind) statusEl.classList.add(kind);
  }

  function opponentLabel(){
    return modeSelect === 'cpu' ? 'o Computador' : 'o Jogador O';
  }

  function currentTurnLabel(){
    if(currentPlayer === 'O' && modeSelect === 'cpu') return 'Vez do Computador';
    return 'Vez do Jogador ' + currentPlayer;
  }

  labelOEl.textContent = modeSelect === 'cpu' ? 'Computador' : 'Jogador O';


  function evaluateBoard(){
    for(const pattern of winPatterns){
      const [a,b,c] = pattern;
      if(options[a] && options[a] === options[b] && options[a] === options[c]){
        return { type:'win', pattern, symbol: options[a] };
      }
    }
    if(options.every(v => v !== '')){
      return { type:'draw' };
    }
    return null;
  }


  function handleCellClick(index){
    if(!running) return;
    if(options[index] !== '') return;
    placeMark(index, currentPlayer);
  }

  function placeMark(index, symbol){
    options[index] = symbol;
    const cellEl = boardEl.querySelector('.cell[data-index="'+index+'"]');
    cellEl.textContent = symbol;
    cellEl.dataset.symbol = symbol;
    cellEl.disabled = true;
    cellEl.classList.add('pop');
    playMoveSound(symbol);

    const result = evaluateBoard();

    if(result && result.type === 'win'){
      handleRoundWin(result.symbol, result.pattern);
      return;
    }
    if(result && result.type === 'draw'){
      handleRoundDraw();
      return;
    }


    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    setStatus(currentTurnLabel());

    if(modeSelect === 'cpu' && currentPlayer === 'O'){
      running = false;
      setTimeout(cpuMove, 400);
    }
  }


  function cpuMove(){
    const idx = chooseCpuMove();
    running = true;
    if(idx !== -1){
      placeMark(idx, 'O');
    }
  }

  function chooseCpuMove(){
    const empty = options.map((v,i)=>v===''?i:-1).filter(i=>i!==-1);
    if(empty.length === 0) return -1;

   
    for(const i of empty){
      const copy = options.slice(); copy[i]='O';
      if(patternWins(copy,'O')) return i;
    }
   
    for(const i of empty){
      const copy = options.slice(); copy[i]='X';
      if(patternWins(copy,'X')) return i;
    }
    
    if(options[4] === '') return 4;

    const corners = [0,2,6,8].filter(i=>options[i]==='');
    if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
   
    const edges = [1,3,5,7].filter(i=>options[i]==='');
    if(edges.length) return edges[Math.floor(Math.random()*edges.length)];
    return empty[0];
  }

  function patternWins(arr, symbol){
    return winPatterns.some(p => p.every(i => arr[i] === symbol));
  }

  
  function handleRoundWin(symbol, pattern){
    running = false;
    drawWinLine(pattern);
    playWinSound();

    if(symbol === 'X'){ winsX++; bumpScore(scoreXEl); }
    else { winsO++; bumpScore(scoreOEl); }
    updateScoreboard();

    const winnerLabel = symbol === 'X' ? 'Jogador X' : (modeSelect==='cpu' ? 'Computador' : 'Jogador O');
    setStatus(winnerLabel + ' venceu a rodada!', 'win');

    const target = totalRounds();

    if(formatSelect === 'bo3'){
      if(winsX === 2 || winsO === 2){
        
        const champion = winsX === 2 ? 'Jogador X' : (modeSelect==='cpu' ? 'Computador' : 'Jogador O');
        launchConfetti();
        setTimeout(() => setStatus(champion + ' é o campeão da partida!', 'win'), 900);
        return; 
      }
      if(currentRound < target){
        
        setTimeout(() => {
          currentRound++;
          updateRoundDisplay();
          startNewRound();
        }, 2000);
        return;
      }
    }
    launchConfetti();
  }

  function handleRoundDraw(){
    running = false;
    playDrawSound();
    setStatus('Rodada Empatada!', 'draw');

    const target = totalRounds();
    if(formatSelect === 'bo3' && currentRound < target){
      setTimeout(() => {
        startNewRound();
      }, 2000);
    }
  }

  function startNewRound(){
    options = Array(9).fill('');
    boardEl.querySelectorAll('.cell').forEach(c => {
      c.textContent = '';
      c.disabled = false;
      c.removeAttribute('data-symbol');
    });
    hideWinLine();
    currentPlayer = 'X';
    running = true;
    setStatus(currentTurnLabel());
  }

  function resetMatch(){
    winsX = 0;
    winsO = 0;
    currentRound = 1;
    updateScoreboard();
    updateRoundDisplay();
    startNewRound();
  }

  function drawWinLine(pattern){
    const [a,,c] = pattern;
    const cellA = boardEl.querySelector('.cell[data-index="'+a+'"]');
    const cellC = boardEl.querySelector('.cell[data-index="'+c+'"]');
    const boardRect = boardEl.getBoundingClientRect();
    const rectA = cellA.getBoundingClientRect();
    const rectC = cellC.getBoundingClientRect();

    const x1 = rectA.left + rectA.width/2 - boardRect.left;
    const y1 = rectA.top + rectA.height/2 - boardRect.top;
    const x2 = rectC.left + rectC.width/2 - boardRect.left;
    const y2 = rectC.top + rectC.height/2 - boardRect.top;

    const dx = x2 - x1, dy = y2 - y1;
    const segLength = Math.sqrt(dx*dx + dy*dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;

    const ux = dx / segLength, uy = dy / segLength;
    const overshoot = 17; 
    const startX = x1 - ux * overshoot;
    const startY = y1 - uy * overshoot;
    const length = segLength + overshoot * 2;

    winLineEl.style.width = length + 'px';
    winLineEl.style.left = startX + 'px';
    winLineEl.style.top = (startY - 3) + 'px'; 
    winLineEl.style.transform = 'rotate(' + angle + 'deg)';
    winLineEl.classList.add('show');
  }

  function hideWinLine(){
    winLineEl.classList.remove('show');
    winLineEl.style.width = '0px';
  }

  function resizeCanvas(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const confettiColors = ['#003366','#0056b3','#d97706','#f4f6f9','#ffffff'];
  let particles = [];
  let confettiRAF = null;

  function launchConfetti(){
    particles = [];
    const originX = confettiCanvas.width / 2;
    for(let i=0;i<120;i++){
      particles.push({
        x: originX + (Math.random()-0.5)*140,
        y: -20 - Math.random()*80,
        vx: (Math.random()-0.5)*5,
        vy: 2 + Math.random()*4,
        size: 5 + Math.random()*6,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rotation: Math.random()*360,
        rotSpeed: (Math.random()-0.5)*10,
        life: 0
      });
    }
    if(confettiRAF) cancelAnimationFrame(confettiRAF);
    animateConfetti();
  }

  function animateConfetti(){
    ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.rotation += p.rotSpeed;
      p.life++;
      if(p.y < confettiCanvas.height + 20) alive = true;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation * Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    if(alive){
      confettiRAF = requestAnimationFrame(animateConfetti);
    } else {
      ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    }
  }

  modeSelectEl.addEventListener('change', () => {
    modeSelect = modeSelectEl.value;
    labelOEl.textContent = modeSelect === 'cpu' ? 'Computador' : 'Jogador O';
    resetMatch();
  });

  formatSelectEl.addEventListener('change', () => {
    formatSelect = formatSelectEl.value;
    resetMatch();
  });

  restartBtn.addEventListener('click', resetMatch);

  updateScoreboard();
  updateRoundDisplay();
  setStatus(currentTurnLabel());
})();

</script>
